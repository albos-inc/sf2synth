name: Player

# Builds the sample player apps in examples/player. Pushing a tag
# `player-v*` (e.g. player-v1.0.0) also publishes them as a release.
on:
  push:
    tags: ["player-v*"]
  pull_request:
    paths: ["examples/player/**", "src/**", "mmap/**", ".github/workflows/player.yml"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: examples/player
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test -p sf2player
      - run: cargo build --release -p sf2player-windows
      - run: Compress-Archive -Path target/release/sf2player.exe -DestinationPath SF2Player-windows-x64.zip
        shell: pwsh
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: examples/player/SF2Player-windows-x64.zip

  apple:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: examples/player/apple
    env:
      MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      APP: build/Build/Products/Release/SF2 Player.app
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin,aarch64-apple-ios
      - name: Build for iOS (unsigned, to check that it builds)
        run: >
          xcodebuild -project SF2Player.xcodeproj -scheme SF2Player -configuration Release
          -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Import the Developer ID certificate
        if: env.MACOS_CERTIFICATE_P12_BASE64 != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "" "$keychain"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - name: Build for macOS (Apple silicon and Intel)
        run: |
          if [ -n "${SIGNED:-}" ]; then
            signing=(CODE_SIGN_STYLE=Manual "CODE_SIGN_IDENTITY=Developer ID Application"
                     "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" OTHER_CODE_SIGN_FLAGS=--timestamp)
          else
            signing=("CODE_SIGN_IDENTITY=-")
          fi
          xcodebuild -project SF2Player.xcodeproj -scheme SF2Player -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath build \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO "${signing[@]}" build
      - name: Notarize
        if: env.SIGNED == '1' && env.APPLE_ID != ''
        run: |
          ditto -c -k --keepParent "$APP" notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$APP"
      - run: ditto -c -k --keepParent "$APP" SF2Player-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: examples/player/apple/SF2Player-macOS.zip

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/player/android
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - run: cargo install cargo-ndk --locked
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;28.2.13676358" > /dev/null
      - name: Release key
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          {
            echo "SF2PLAYER_STORE_FILE=$RUNNER_TEMP/release.jks"
            echo "SF2PLAYER_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "SF2PLAYER_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "SF2PLAYER_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"
      - run: ./gradlew assembleRelease
      - run: cp app/build/outputs/apk/release/app-release.apk SF2Player-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: examples/player/android/SF2Player-android.apk

  release:
    if: startsWith(github.ref, 'refs/tags/player-v')
    needs: [windows, apple, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'EOF'
          SF2 Player: choose an SF2 (or DLS) file and a MIDI file and play it, on sf2synth.
          See [examples/player](https://github.com/albos-inc/sf2synth/tree/main/examples/player).

          | Download | |
          |---|---|
          | `SF2Player-windows-x64.zip` | Windows 10/11: unzip and run `sf2player.exe`. If SmartScreen warns, choose *More info → Run anyway*. |
          | `SF2Player-macOS.zip` | macOS 14 or later: unzip and move *SF2 Player* to Applications. If macOS says it can't check the app, right-click it → *Open* once (or *System Settings → Privacy & Security → Open Anyway*). |
          | `SF2Player-android.apk` | Android 8 or later: open the file on the device and allow installing from that source. |

          On Windows and macOS the system's General MIDI sounds play until you choose an SF2.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --title "SF2 Player ${GITHUB_REF_NAME#player-v}" --notes-file notes.md
