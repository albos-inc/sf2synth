name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --all-targets
      - run: cargo test --doc

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  cross:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-linux-android, armv7-linux-androideabi, aarch64-apple-ios, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo check --lib --target ${{ matrix.target }}

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - run: cargo check --lib

  # The C interface and the memory-mapping crate it uses.
  capi:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo test --manifest-path mmap/Cargo.toml
      - run: cargo test --manifest-path capi/Cargo.toml
      - run: cargo clippy --manifest-path mmap/Cargo.toml --all-targets -- -D warnings
      - run: cargo clippy --manifest-path capi/Cargo.toml --all-targets -- -D warnings

  # The Swift package (with the xcframework built from source) and the AUv3
  # example.
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin, aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      - run: apple/build-xcframework.sh
      - run: cargo run --manifest-path capi/Cargo.toml --example test_font -- "$RUNNER_TEMP/test.sf2"
      - run: swift test
        env:
          SF2SYNTH_TEST_FONT: ${{ runner.temp }}/test.sf2
      - run: xcodebuild -scheme SF2Synth -destination "generic/platform=iOS Simulator" build -quiet
      - name: Build the AUv3 example
        working-directory: examples/auv3
        run: |
          xcodebuild -project SF2SynthAU.xcodeproj -scheme SF2SynthAU -destination "platform=macOS" CODE_SIGNING_ALLOWED=NO build -quiet
          xcodebuild -project SF2SynthAU.xcodeproj -scheme SF2SynthAU -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build -quiet
