[package]
name = "sf2player-windows"
description = "SF2 Player for Windows: plays MIDI files with an SF2 on sf2synth."
version.workspace = true
edition.workspace = true
rust-version = "1.92"
license.workspace = true
authors.workspace = true
publish.workspace = true

[[bin]]
name = "sf2player"
path = "src/main.rs"

[dependencies]
cpal = "0.18.2"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui-phosphor = "0.14"
rfd = "0.17.2"
sf2player = { path = "../core" }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
