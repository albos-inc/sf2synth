# The player apps' Rust side: `core` is the player itself, `ffi` exposes it
# to Swift (C ABI) and Kotlin (JNI), and `windows` is the Windows app.
[workspace]
members = ["core", "ffi", "windows"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
authors = ["Albos Inc."]
publish = false

[profile.release]
lto = true
codegen-units = 1
