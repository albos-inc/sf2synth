# The Xcode project is generated from this file with XcodeGen
# (`xcodegen generate`); the generated SF2Player.xcodeproj is checked in, so
# XcodeGen is only needed to change the project.
name: SF2Player
options:
  bundleIdPrefix: jp.albos
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: ""
targets:
  SF2Player:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: SF2Player
        excludes: ["Info.plist"]
    preBuildScripts:
      - name: Build the Rust player
        script: '"$SRCROOT/build-rust.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(BUILT_PRODUCTS_DIR)/libsf2player_ffi.a
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.albos.sf2player
        PRODUCT_NAME: SF2 Player
        INFOPLIST_FILE: SF2Player/Info.plist
        SWIFT_OBJC_BRIDGING_HEADER: SF2Player/SF2Player-Bridging-Header.h
        LIBRARY_SEARCH_PATHS: $(BUILT_PRODUCTS_DIR)
        OTHER_LDFLAGS: -lsf2player_ffi
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": SF2Player/SF2Player.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
    info:
      path: SF2Player/Info.plist
      properties:
        CFBundleDisplayName: SF2 Player
        LSApplicationCategoryType: public.app-category.music
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        LSSupportsOpeningDocumentsInPlace: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: jp.albos.sf2player.sf2
            UTTypeDescription: SoundFont 2
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sf2]
          - UTTypeIdentifier: jp.albos.sf2player.dls
            UTTypeDescription: DLS Instruments
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [dls]
        CFBundleDocumentTypes:
          - CFBundleTypeName: MIDI File
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.midi-audio]
          - CFBundleTypeName: SoundFont
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [jp.albos.sf2player.sf2, jp.albos.sf2player.dls]
